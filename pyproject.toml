[project]
name = "vendor-fraud-review-formal"
version = "0.1.0"
description = "The Vendor Fraud Review Op (Intelligence Hub whitepaper, Rev 9, section 5.6) implemented as an executable specification"
authors = [{ name = "Michael Zargham" }]
license = { text = "CC-BY-SA-4.0" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rdflib>=7.0",
    "pyshacl>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "jupyter>=1.0",
    "ipykernel>=6.29",
    "pyyaml>=6.0",
    "mystmd>=1.3",
]

[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning:rdflib"]
